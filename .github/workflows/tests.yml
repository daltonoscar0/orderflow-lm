name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compiler version
        run: g++ --version

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      # 15 tests: parser, book, validate, tokenizer, plus the CLI-level guards
      # (divergence detection, split boundaries, tokenize-requires-fit). They
      # run against the checked-in fixtures under tests/fixtures/, so nothing
      # is downloaded.
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
